name: Update grammars

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    # grammars.dat itself is deliberately not listed: regenerating it must not trigger another run.
    paths:
      - components/**
      - generate.js
      - package.json
      - package-lock.json

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 22
    - run: npm install
    - run: npm start
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: grammars.dat
        path: ./libprisma/grammars.dat
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v8
      with:
        commit-message: Update grammars
        title: Update grammars
        branch: update-grammars
