name: Check generated files

# The path filter is the whole test: the job only exists when the pull request
# touches grammars.dat, so reaching it is already the failure.
on:
  pull_request:
    paths:
      - libprisma/grammars.dat

permissions: {}

jobs:
  grammars:
    runs-on: ubuntu-latest
    # A pull request opened with GITHUB_TOKEN cannot trigger this workflow at all,
    # so the guard only matters if "Update grammars" is ever moved to a PAT.
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    steps:
    - name: Reject changes to the generated grammar table
      run: |
        echo "::error file=libprisma/grammars.dat::libprisma/grammars.dat is generated by generate.js and is regenerated on master by the Update grammars workflow. Please drop it from this pull request and keep only the components/ and generate.js changes."
        exit 1
